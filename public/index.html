    <meta name="theme-color" content="#0d0e12" />

    <!-- Brand SEO Title & Core Metadata -->

    <!-- Open Graph / Meta Platforms Data -->

    <!-- Twitter / X Card Data -->

    <meta name="twitter:creator" content="@CuztoOfficial" />
    <meta name="twitter:title" content="Cuztory | Nxt-gen Fashion Hub" />
    <meta name="twitter:description" content="Step into the future of luxury tailoring. Height-calibrated formalwear and limited-edition partywear." />
    <meta name="twitter:image" content="https://cuztory.in/banner.png" />

    <!-- Google Search Verification -->
    <meta name="google-site-verification" content="o8zs--Y_kyfE20S0bdnHn_g-FoW8KfJcq8DNGZLjYAE" />

    <!-- Performance Optimization: Preconnect & Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,800;1,400&display=swap" rel="stylesheet" />

    <!-- ========================================== -->
    <!-- STRUCTURED DATA (JSON-LD SCHEMAS FOR SEO) -->
    <!-- ========================================== -->

    <!-- 1. Brand & Nxt-gen Store Entity -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ClothingStore",
      "name": "Cuztory",
      "slogan": "Nxt-gen Fashion Hub",
      "alternateName": "Cuztory Studio",
      "url": "https://cuztory.in/",
      "logo": "https://cuztory.in/logo.png",
      "image": "https://cuztory.in/banner.png",
      "description": "Nxt-gen fashion hub specializing in bespoke height-tailored formals, statement partywear, and limited-edition designer apparel.",
      "telephone": "+91 8050084991",
      "priceRange": "₹₹₹",
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "IN"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+91 8050084991",
        "contactType": "customer service",
        "areaServed": "IN",
        "availableLanguage": "en"
      },
      "sameAs": [
        "https://www.instagram.com/cuztory.in?igsh=MXNyamx4NW5wc3dxcQ==",
        "https://www.facebook.com/profile.php?id=61574254927966",
        "https://www.youtube.com/@CuztoOfficial"
      ]
    }
    </script>

    <!-- 2. Height Calibration & Customization Service Schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Service",
      "serviceType": "Nxt-Gen Height-Calibrated Custom Fitting",
      "provider": {
        "@type": "ClothingStore",
        "name": "Cuztory"
      },
      "areaServed": "IN",
      "description": "Height-matched precision tailoring for formal suits, luxury blazers, party shirts, and custom-proportioned silhouettes."
    }
    </script>

    <!-- 3. Dynamic Search Action Schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Cuztory",
      "url": "https://cuztory.in/",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://cuztory.in/search?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- 4. FAQ Schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What makes Cuztory a Nxt-gen Fashion Hub?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Cuztory replaces cookie-cutter sizing with height-calibrated precision fits, avant-garde formal aesthetics, and limited-run drops engineered for modern trendsetters."
          }
        },
        {
          "@type": "Question",
          "name": "How does height customization work on Cuztory?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Simply pick your chest/waist measurement and specify your exact height during checkout. Our tailoring algorithms adjust sleeve lengths, torso drops, and trousers hems automatically."
          }
        }
      ]
    }
    </script>

    <!-- Stylesheets & Analytics -->
    <link rel="stylesheet" href="%PUBLIC_URL%/styles.css" />
    <script defer src="/_vercel/insights/script.js"></script>

    <!-- Preloader Styling -->
    <style>
      body {
        margin: 0;
        background-color: #0d0e12;
        color: #f3f4f6;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        overflow-x: hidden;
      }
      #app-preloader {
        position: fixed;
        inset: 0;
        background: #0d0e12;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.5s ease;
      }
      .loader-title {
        font-family: 'Cinzel', serif;
        font-size: 2.2rem;
        letter-spacing: 0.35em;
        text-transform: uppercase;
        color: #d4af37;
        margin-bottom: 8px;
      }
      .loader-sub {
        font-size: 0.8rem;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: #9ca3af;
      }
      .loader-bar {
        width: 150px;
        height: 2px;
        background: rgba(212, 175, 55, 0.2);
        margin-top: 28px;
        position: relative;
        overflow: hidden;
      }
      .loader-bar::after {
        content: '';
        position: absolute;
        left: -50%;
        top: 0;
        height: 100%;
        width: 50%;
        background: #d4af37;
        animation: loading 1.5s infinite ease-in-out;
      }
      @keyframes loading {
        0% { left: -50%; }
        100% { left: 100%; }
      }
    </style>
  </head>

  <body>
    <!-- Fallback UI for non-JS environments -->
    <noscript>
      <div style="padding: 30px; text-align: center; color: #fff; background: #0d0e12;">
        <h2>Cuztory | Nxt-gen Fashion Hub</h2>
        <p>Please enable JavaScript to access our height calibration tool, bespoke formal catalog, and exclusive partywear drops.</p>
      </div>
    </noscript>

    <!-- Preloader Screen -->
    <div id="app-preloader">
      <div class="loader-title">Cuztory</div>
      <div class="loader-sub">Nxt-Gen Fashion Hub</div>
      <div class="loader-bar"></div>
    </div>

    <!-- React App Root Container -->
    <div id="root"></div>

    <!-- Fade Out Script -->
    <script>
      window.addEventListener('DOMContentLoaded', () => {
        const preloader = document.getElementById('app-preloader');
        if (preloader) {
          setTimeout(() => {
            preloader.style.opacity = '0';
            setTimeout(() => preloader.remove(), 500);
          }, 300);
        }
      });
    </script>
  </body>
</html>
